# Schemat codebooka v0.1 — ŹRÓDŁO PRAWDY dla dozwolonych wartości.
# Opis słowny każdej zmiennej jest w 02_codebook_v0.1.md; spójność sprawdza tools/checks.py consistency.
# Zmieniasz wartości? Zmień tu, w 02_codebook i w templates/codebook_changelog.md, podnieś wersję.
version: "0.1"
levels:
  L1: "z tekstu i metadanych reklamy (wykonalne bez dostępu do kreacji)"
  L2: "wizualne (warunkowe: punkt decyzyjny D1; kodowane tylko jeśli legalnie dostępne są kreacje)"

# Pola identyfikujące (nie są kodowane, wypełnia pipeline/inżynier danych)
id_fields: [ad_id, creative_id, advertiser_id]

variables:
  celeb_mention:
    level: L1
    role: exposure          # zmienna eksponująca: błąd pomiaru bezpośrednio obciąża wynik końcowy
    values: [explicit_name, implied, none, unsure]
  celeb_id:
    level: L1
    role: exposure_detail
    values: free_text       # znormalizowane nazwisko albo "unrecognized"; wymagane gdy celeb_mention in [explicit_name, implied]
  celeb_category:
    level: L1
    role: covariate
    values: [politician, business_finance, sport, media_entertainment, influencer, other, na]
  celeb_claim:
    level: L1
    role: mechanism
    values: [fabricated_quote, fabricated_event, product_recommendation, none, unsure]
  fake_news_format:
    level: L1
    role: covariate
    values: ["yes", "no", unsure]
  scam_type:
    level: L1
    role: stratifier
    values: [investment_crypto, health_supplements, giveaway_contest, benefits_subsidies, shop_counterfeit, other, not_scam, unclear]
  scam_judgement:
    level: L1
    role: secondary_label   # ocena annotatora; NIE zastępuje dowodu zewnętrznego (patrz external_evidence)
    values: [scam, not_scam, unclear]
  urgency_cue:
    level: L1
    role: covariate
    values: ["yes", "no", unsure]
  guaranteed_return_claim:
    level: L1
    role: covariate
    values: ["yes", "no", unsure]
  authority_cue:
    level: L1
    role: covariate
    values: [celebrity, institution_or_expert, none, unsure]
  cta_type:
    level: L1
    role: covariate
    values: [learn_more, sign_up, buy, download, contact, other, none]
  # --- poziom 2: tylko po decyzji D1 ---
  media_type:
    level: L2
    role: covariate
    values: [image, video, carousel, text_only, unavailable]
  celeb_face_visible:
    level: L2
    role: exposure
    values: ["yes", "no", unsure, na_no_media]
  media_synthetic_suspected:
    level: L2
    role: covariate
    values: ["yes", suspected, "no", unsure, na_no_media]
  media_synthetic_cue:
    level: L2
    role: covariate
    values: [visual_artifact, lip_audio_mismatch, voice_unnatural, platform_label, other, none, na]

# Pola zewnętrzne: NIE są kodowane przez annotatorów; wypełnia pipeline z danych źródła (zewnętrznej listy scamów nie używamy).
# Annotatorzy kodujący zmienne ekspozycji NIE widzą tych pól ani wyników (zasięgu, czasu emisji): kodowanie na ślepo.
external_evidence:
  dest_domain: "domena docelowa reklamy (opcjonalna, jeśli źródło ją podaje i wolno ją zapisać)"
  platform_removal: ["yes", "no", unknown]   # UWAGA: różnicowy błąd etykiety (patrz 06_rejestr_ryzyk.md, R03)

annotation_sheet_columns: [ad_id, creative_id, annotator_id, pilot_round, codebook_version, timestamp, notes]
