name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testy pipeline'u i narzędzi walidacji
        run: python -m unittest discover -s tests -v

  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brak danych w repozytorium
        run: |
          # Wyjątek przejściowy: ukraine-source/with_sentiment.csv (decyzja D1 w CLEANUP.md). Po decyzji usunąć z listy.
          bad=$(git ls-files | grep -E '\.(csv|parquet|xlsx|jsonl|csv\.gz)$' \
                | grep -v -E '^(templates/|data_synthetic/|logs/runs\.jsonl$|ukraine-source/with_sentiment\.csv$)' || true)
          if [ -n "$bad" ]; then
            echo "Pliki danych nie mogą trafiać do repozytorium:"; echo "$bad"; exit 1
          fi
